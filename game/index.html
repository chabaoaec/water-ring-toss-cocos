<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f0eee2"><meta name="description" content="口袋潮汐：双喷流水中套圈，一台让心慢下来的复古水机。"><title>Pocket Tide · Demo v5.3</title><link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head>
<body>
<div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
<main class="experience">


<section class="toy" aria-label="水中套圈玩具">
<div class="shell-top"><span class="toy-model">POCKET TIDE</span><span class="toy-badge"><i></i> DEMO v5.3</span></div>
<div class="dashboard"><div class="score-block"><span class="stat-label">已套入</span><span class="score-number"><b id="score">0</b><em>/ 8</em></span></div><div class="dashboard-right"><div><span class="stat-label">用时</span><strong id="timer">00:00</strong></div><button id="menu" class="utility menu-trigger" aria-expanded="false" aria-controls="menu-panel">☰ 菜单</button></div></div>
<div class="water-stage"><div class="glass-rim"><div class="tank-window"><div id="GameDiv"><div id="Cocos3dGameContainer"><canvas id="GameCanvas" width="420" height="580" aria-label="水中彩环与两根立柱。使用下方左右喷流按钮游玩。"></canvas></div></div><div id="loading" role="status">正在注满一小片海…</div><div id="menu-panel" class="pause-overlay" role="dialog" aria-label="游戏菜单" aria-modal="true" hidden><p>休息一下</p><span class="menu-stats">本局喷流 <strong id="pumps">00</strong> 次</span><button id="resume" class="menu-primary">继续游玩</button><button id="sound" aria-pressed="false">声音 关</button><button id="reset" aria-label="重新开始">重新开始</button><div class="gravity-controls" role="group" aria-label="手机倾斜与晃动"><button id="gravity-toggle" aria-pressed="true" aria-describedby="gravity-status">体感 开 · 等待读数</button><div class="gravity-actions"><button id="gravity-authorize" hidden>授权传感器</button><button id="gravity-calibrate" disabled>校准当前姿势</button></div><span id="gravity-status" class="gravity-status" role="status" aria-live="polite">手机体感默认开启，等待传感器。</span></div><span class="menu-help">短按微喷，长按加压。<br>单次水量有限，松开吸水补充。<br>手机可倾斜，也可轻轻摇晃。</span></div><div id="win" class="win" hidden><div class="win-symbol" aria-hidden="true">✳</div><p class="eyebrow">A PERFECT LITTLE MOMENT</p><h2>全部套中！</h2><p>今天的小小成就，收好啦。</p><p id="win-stats" class="win-stats"></p><button id="play-again">打开菜单 <span aria-hidden="true">☰</span></button></div></div></div>
</div><div class="collection"><div id="dots" aria-label="套环进度"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="progress-track" aria-hidden="true"><div id="progress"></div></div></div>
<p id="hint" class="hint">轻点微喷，长按加压；松开吸水，补好再按。</p>
<div class="controls"><div class="jet-wrap"><button id="left-jet" class="jet" aria-describedby="left-feedback" aria-label="左侧喷流，按住蓄力，也可使用 A 或左方向键" aria-pressed="false"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M11 31V19c0-4 3-7 7-7m-3-4 4 4-4 4M23 33V10m-4 4 4-5 4 5m6 17V20c0-4-2-6-5-6"/></svg></button><span id="left-feedback" class="jet-feedback">按住加压</span><div id="left-fuel" class="jet-meter" role="progressbar" aria-label="左侧剩余水量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i></div><span class="button-label">左喷流 <kbd>A</kbd><kbd>←</kbd></span></div><div class="control-middle"><span class="wave-icon" aria-hidden="true">≈</span><span>短按微喷<br>长按加压</span></div><div class="jet-wrap"><button id="right-jet" class="jet" aria-describedby="right-feedback" aria-label="右侧喷流，按住蓄力，也可使用 D 或右方向键" aria-pressed="false"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M11 31V19c0-4 3-7 7-7m-3-4 4 4-4 4M23 33V10m-4 4 4-5 4 5m6 17V20c0-4-2-6-5-6"/></svg></button><span id="right-feedback" class="jet-feedback">按住加压</span><div id="right-fuel" class="jet-meter" role="progressbar" aria-label="右侧剩余水量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><i></i></div><span class="button-label">右喷流 <kbd>D</kbd><kbd>→</kbd></span></div></div>
<div class="shell-bottom"><span>慢慢来，就很好</span><span class="screw" aria-hidden="true">−</span><span>8 个彩环 · 一点耐心</span></div>
</section>
<footer><p><span aria-hidden="true">✳</span> 没有倒计时，只有好心情。</p><span>左右可同时按 · 手机可倾斜与晃动</span></footer>
</main><p id="status" class="sr-only" role="status" aria-live="polite"></p><script type="module" src="./src/viewport.js"></script><script type="module" src="./src/main.js"></script>
</body></html>
